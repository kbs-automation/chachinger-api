name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: api

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cha3535-api
  ECS_CLUSTER: cha3535
  ECS_SERVICE: cha3535-api
  ECS_TASK_FAMILY: cha3535-api
  CONTAINER_NAME: api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cha3535
          POSTGRES_PASSWORD: cha3535
          POSTGRES_DB: cha3535
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cha3535" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://cha3535:cha3535@localhost:5432/cha3535
      TEST_DATABASE_URL: postgresql+asyncpg://cha3535:cha3535@localhost:5432/cha3535_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Create test database
        run: PGPASSWORD=cha3535 psql -h localhost -U cha3535 -c "CREATE DATABASE cha3535_test"
      - name: RULE 1 — click_number never exposed
        run: pytest -q tests/test_click_number_not_exposed.py
      - name: Full test suite
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cha3535-api:${{ github.sha }} .

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Render task definition
        id: taskdef
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}
      - name: Run migrations
        run: |
          aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$ECS_TASK_FAMILY" \
            --network-configuration "${{ secrets.ECS_NETWORK_CONFIGURATION }}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.CONTAINER_NAME }}","command":["alembic","upgrade","head"]}]}'
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
